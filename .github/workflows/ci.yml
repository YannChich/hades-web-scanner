name: CI

# Run the quality gate on every push and pull request to main: the same checks the daily
# autonomous session runs locally (module import check + full test suite), so a regression can
# never reach main unnoticed. Mirrors docs/ROADMAP.md's "never leave main broken" rule.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so CI doesn't pile up on rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Optional heavy extras (playwright browsers, sslyze) are not needed by the test suite —
        # tests mock all HTTP — so we don't run `playwright install`. The Python packages still
        # install cleanly from requirements.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Module import check
        run: python tools/check_imports.py

      - name: Run tests
        run: pytest -q
